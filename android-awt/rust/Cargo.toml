[package]
name = "runelite-awt-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "runelite_awt_native"
crate-type = ["cdylib"]

[dependencies]
jni = { version = "0.21", default-features = false }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
